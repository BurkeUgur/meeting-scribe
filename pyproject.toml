[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-scribe"
version = "0.2.0"
description = "Record what your computer plays during an online meeting and transcribe it locally with Whisper."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0",
    "SoundCard>=0.4",
    "numpy",
]

[project.scripts]
scribe = "meeting_scribe.cli:main"

[tool.setuptools]
packages = ["meeting_scribe"]
