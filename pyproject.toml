[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toplanti-takip"
version = "0.1.0"
description = "Online toplantıların sesini bilgisayardan kaydedip yazıya döker (Whisper)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0",
    "SoundCard>=0.4",
    "numpy",
]

[project.scripts]
toplanti = "toplanti_takip.cli:main"

[tool.setuptools]
packages = ["toplanti_takip"]
